# Decap CMS configuration for tranquillinfra.com.
#
# Mirrors the Zod schemas in src/content.config.ts — add every new content
# field in both places. Content is read at build time only: a save here
# commits to the repository, and the Cloudflare build of that branch
# publishes the change.
#
# The admin itself is served from /decapcms/ (self-hosted bundle, no CDN
# dependency). Authentication goes through this site's own OAuth broker:
#   - src/pages/api/cms/auth.ts opens the GitHub authorize page,
#   - src/pages/api/cms/done.ts exchanges the code server-side and hands the
#     token to the CMS popup over Decap's Netlify-style window handshake.
# The popup is same-origin, so the CSP needs no auth host; the browser only
# ever needs `api.github.com` in `connect-src` for the CMS's own REST calls.
#
# One-time GitHub-side setup:
#   1. The OAuth App's callback URL must be
#      `https://www.tranquillinfra.com/api/cms/done`.
#   2. For a GitHub App (client id `Ov23li…`), grant repository "Contents"
#      read+write — the scope parameter is ignored for GitHub Apps. A classic
#      OAuth App gets `repo` from the authorize URL.
#   3. `wrangler secret put GITHUB_OAUTH_CLIENT_SECRET` (the client id lives
#      in wrangler.jsonc [vars]). Without both, /api/cms/auth answers 503.
# Alternative with zero self-hosted code: Decap Bridge
# (https://www.decapbridge.com) — register the repo, then set
# `base_url: https://auth.decapbridge.com`, `auth_type: implicit` and the
# bridge's app id here instead. Not chosen: one more third party in the
# editorial path.

backend:
  name: github
  repo: Manish191103/tranquillinfra
  branch: main
  base_url: 'https://www.tranquillinfra.com'
  auth_endpoint: 'api/cms/auth'

site_url: 'https://www.tranquillinfra.com'

# Uploaded images land in src/assets/images and are referenced as
# ~/assets/images/…, the form the AstroWind <Image /> resolver (findImage)
# understands, so uploads go through Sharp optimisation like every other
# local image.
media_folder: 'src/assets/images'
public_folder: '~/assets/images'

collections:
  # Blog posts — src/content/blog, rendered at /blog/<slug>/.
  - name: blog
    label: Insights (Blog)
    folder: 'src/content/blog'
    create: true
    extension: md
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Cover image alt text, name: imageAlt, widget: string, required: false }
      - { label: Published at, name: publishedAt, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Updated at, name: updatedAt, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false, collapsed: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - label: FAQ (rendered as an FAQ section with FAQPage schema)
        name: faq
        widget: list
        required: false
        collapsed: true
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - label: Sources
        name: sources
        widget: list
        required: false
        collapsed: true
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Body, name: body, widget: markdown }

  # Standard pages — src/content/pages, rendered at /<slug>/.
  - name: pages
    label: Pages
    folder: 'src/content/pages'
    # Editing only: new pages are added at the codebase level, so a CMS entry
    # can't create a route-less data file.
    create: false
    extension: md
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Hero heading, name: heroTitle, widget: string, required: false }
      - { label: Hero intro, name: heroIntro, widget: text, required: false }
      - { label: Published at, name: publishedAt, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Updated at, name: updatedAt, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }

  # Project pages — src/content/projects, rendered at /projects/<slug>/.
  - name: projects
    label: Projects
    folder: 'src/content/projects'
    # Editing only: new project pages are added at the codebase level.
    create: false
    extension: md
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Display title, name: displayTitle, widget: string, required: false }
      - { label: Description, name: description, widget: text }
      - { label: Project type, name: projectType, widget: string, required: false }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Intro, name: intro, widget: text, required: false }
      - { label: Layout summary, name: layout, widget: string, required: false }
      - { label: Verification note, name: verificationNote, widget: text, required: false }
      - label: Hero
        name: hero
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Poster image, name: image, widget: image }
          - { label: Poster alt text, name: alt, widget: string }
          - { label: Caption, name: caption, widget: string, required: false }
          - label: Video
            name: video
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Video URL, name: src, widget: string }
              - { label: Mobile video URL, name: mobileSrc, widget: string, required: false }
      - label: Plan section
        name: plan
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Image, name: image, widget: image }
          - { label: Image alt text, name: alt, widget: string }
          - { label: Caption, name: caption, widget: string, required: false }
          - { label: Note, name: note, widget: text, required: false }
      - label: Story section
        name: story
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Note, name: note, widget: text, required: false }
          - label: Images
            name: images
            widget: list
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Alt text, name: alt, widget: string }
              - { label: Caption, name: caption, widget: string, required: false }
      - label: Amenities section
        name: amenities
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Note, name: note, widget: text, required: false }
          - label: Groups
            name: groups
            widget: list
            fields:
              - { label: Group title, name: title, widget: string }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Description, name: description, widget: string }
                  - { label: 'Icon (tabler name, no prefix)', name: icon, widget: string, required: false }
      - label: Location section
        name: locationSection
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Note, name: note, widget: text, required: false }
          - label: Groups
            name: groups
            widget: list
            fields:
              - { label: Group title, name: title, widget: string }
              - { label: Landmarks, name: landmarks, widget: list }
      - label: Facts section
        name: facts
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Intro, name: intro, widget: text, required: false }
      - label: FAQ section
        name: faq
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Questions
            name: items
            widget: list
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }
      - label: Enquiry section
        name: enquiry
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Intro, name: intro, widget: text, required: false }
      - label: Testimonials section
        name: testimonials
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Note, name: note, widget: text, required: false }
          - label: Buyer videos
            name: items
            widget: list
            fields:
              - { label: Id, name: id, widget: string }
              - label: Video
                name: video
                widget: object
                fields:
                  - { label: Video URL, name: src, widget: string }
                  - { label: Poster image, name: poster, widget: image }
                  - { label: Poster alt text, name: posterAlt, widget: string }
                  - { label: Duration, name: duration, widget: string }
                  - { label: Orientation, name: orientation, widget: select, options: ['portrait', 'landscape'] }
      - { label: Directions URL, name: directionsUrl, widget: string, required: false }
      - label: Map coordinates
        name: coordinates
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Latitude, name: latitude, widget: number, value_type: float }
          - { label: Longitude, name: longitude, widget: number, value_type: float }
      - { label: Published at, name: publishedAt, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Updated at, name: updatedAt, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }
